name: material_4
description: "Material 4 — a single universal Flutter shape container: built-in and custom shapes, unified backgrounds, and a 40-style shape-following border engine."
version: 1.0.0
homepage: https://github.com/juwelzan/material_4
repository: https://github.com/juwelzan/material_4
issue_tracker: https://github.com/juwelzan/material_4/issues

topics:
  - shapes
  - custom-painter
  - animation
  - container
  - ui

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiquidGlassWidgetsPlugin

  shaders:
    - shaders/lightweight_glass.frag
    - shaders/interactive_indicator.frag
    - shaders/liquid_glass_geometry_blended.frag
    - shaders/liquid_glass_render.frag
    - shaders/progressive_blur.frag
